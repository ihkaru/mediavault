services:
  mediavault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-mediavault-api}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - API_KEY=${API_KEY:-mv_secret_key_prod}
      - DATABASE_URL=sqlite:/app/data/mediavault.db?mode=rwc
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_LOCAL_DIR=/app/data/storage
      - STORAGE_TEMP_DIR=/app/data/temp
      - S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}
      - S3_BUCKET=${S3_BUCKET:-mediavault}
      - S3_REGION=${S3_REGION:-garage}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MEILI_ENABLED=${MEILI_ENABLED:-true}
      - MEILI_HOST=${MEILI_HOST:-http://meilisearch:7700}
      - MEILI_API_KEY=${MEILI_MASTER_KEY:-meili_master_key_123456}
      - MEILI_INDEX=${MEILI_INDEX:-mediavault_files}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-250}
      - RUST_LOG=${RUST_LOG:-mediavault=info,tower_http=info}
      - COOLIFY_FQDN=${SERVICE_FQDN_MEDIAVAULT:-${COOLIFY_FQDN}}
      - SERVICE_FQDN_MEDIAVAULT=${SERVICE_FQDN_MEDIAVAULT}
    volumes:
      - vault_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    networks:
      - internal_net
      - coolify
    depends_on:
      meilisearch:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: ${MEILI_CONTAINER_NAME:-mediavault-meilisearch}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    expose:
      - "7700"
    environment:
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-meili_master_key_123456}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    networks:
      - internal_net

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: ${GARAGE_CONTAINER_NAME:-mediavault-garage}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    expose:
      - "3900"
      - "3902"
    environment:
      - RUST_LOG=garage=info
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    networks:
      - internal_net

volumes:
  vault_data:
    name: ${VAULT_VOLUME_NAME:-mediavault_data}
  meili_data:
    name: ${MEILI_VOLUME_NAME:-mediavault_meili_data}
  garage_meta:
    name: ${GARAGE_META_VOLUME_NAME:-mediavault_garage_meta}
  garage_data:
    name: ${GARAGE_DATA_VOLUME_NAME:-mediavault_garage_data}

networks:
  internal_net:
    driver: bridge
  coolify:
    external: true
